# Cloudflare Worker that relays Aura's chat requests to the Claude API.
# Deployed by .github/workflows/relay.yml; secrets are set there, never stored here.
name = "aura-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
ANTHROPIC_MODEL = "claude-sonnet-5-5"
MAX_OUTPUT_TOKENS = "2048"
# ElevenLabs voice for read-aloud (the key is a secret set by the deploy workflow).
ELEVENLABS_VOICE_ID = "wsj349S7Ee6gB32Poaf0"
ELEVENLABS_MODEL = "eleven_flash_v2_5"
# Per-user daily caps. They only take effect once the USAGE key-value store is attached: the deploy
# workflow adds it when the AURA_USAGE_KV_ID repository secret is set (see relay/README.md).
DAILY_CHAT_LIMIT = "300"
DAILY_SPEAK_LIMIT = "150"

# Per-user limits (requests per minute) so a loop or stolen token can't burn credits fast.
# Spend limits in the Anthropic and ElevenLabs consoles remain the hard cap.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

[[ratelimits]]
name = "SPEAK_LIMITER"
namespace_id = "1002"
simple = { limit = 15, period = 60 }

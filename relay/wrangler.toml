# Cloudflare Worker that relays Aura's chat requests to the Claude API.
# Deployed by .github/workflows/relay.yml; secrets are set there, never stored here.
name = "aura-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
ANTHROPIC_MODEL = "claude-sonnet-5-5"
MAX_OUTPUT_TOKENS = "2048"
# ElevenLabs voice for read-aloud (the key is a secret set by the deploy workflow).
ELEVENLABS_VOICE_ID = "wsj349S7Ee6gB32Poaf0"
ELEVENLABS_MODEL = "eleven_flash_v2_5"
# Per-user daily caps. They only take effect once the USAGE key-value store is attached: the deploy
# workflow adds it when the AURA_USAGE_KV_ID repository secret is set (see relay/README.md).
DAILY_CHAT_LIMIT = "300"
DAILY_SPEAK_LIMIT = "150"
# Web search (only when the user turns it on in the app): searches per reply, and replies with
# web search per user per day. Each search is billed by Anthropic (about $10 per 1,000).
WEB_SEARCH_MAX_USES = "3"
DAILY_SEARCH_LIMIT = "100"
# Opening links (when the user's chat has one and the switch is on): pages per reply. Costs only
# the page text Claude reads, at most 20,000 tokens a page.
WEB_FETCH_MAX_USES = "3"

# Images and videos made by OpenAI (only when the OPENAI_API_KEY secret is set and the user turns it
# on in the app). Videos cost much more than images, so they have a low daily cap and a length limit.
OPENAI_IMAGE_MODEL = "gpt-image-2"
OPENAI_IMAGE_QUALITY = "medium"
OPENAI_VIDEO_MODEL = "sora-2"
VIDEO_MAX_SECONDS = "8"
DAILY_IMAGE_LIMIT = "20"
DAILY_VIDEO_LIMIT = "3"

# Per-user limits (requests per minute) so a loop or stolen token can't burn credits fast.
# Spend limits in the Anthropic, ElevenLabs and OpenAI consoles remain the hard cap.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

[[ratelimits]]
name = "SPEAK_LIMITER"
namespace_id = "1002"
simple = { limit = 15, period = 60 }

# Creating images and videos (checking on a video doesn't count).
[[ratelimits]]
name = "MEDIA_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

name: Android signing fingerprints

on:
  workflow_dispatch:
  push:
    branches:
      - chore/android-signing-fingerprints

permissions:
  contents: read

jobs:
  signing-report:
    name: Generate Android signing report
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate signing report
        run: ./gradlew :app:signingReport --no-daemon

      - name: Publish debug SHA-1 to workflow summary
        shell: bash
        run: |
          REPORT="$(find app/build -type f -iname '*signing*report*' -o -iname 'signingReport*.txt' 2>/dev/null | head -n 1)"
          if [ -z "$REPORT" ]; then
            ./gradlew :app:signingReport --no-daemon > signing-report.txt
            REPORT="signing-report.txt"
          fi
          awk '
            /Variant: debug/ { in_debug=1; print; next }
            /Variant:/ { if (in_debug) exit }
            in_debug { print }
          ' "$REPORT" | tee debug-signing-summary.txt
          if ! grep -qi 'SHA1:' debug-signing-summary.txt; then
            echo "Could not find the debug SHA-1 fingerprint in the signing report." >&2
            exit 1
          fi
          {
            echo "## Aura Android debug signing fingerprint"
            echo
            echo 'Copy the SHA-1 value below into Firebase Console → Project settings → Your apps → Android app → SHA certificate fingerprints.'
            echo
            echo 'This is a public certificate fingerprint, not a password or API key.'
            echo
            echo ' ```text'
            cat debug-signing-summary.txt
            echo ' ```'
          } >> "$GITHUB_STEP_SUMMARY"

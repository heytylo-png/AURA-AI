name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Actions are pinned to exact commits (the tag is in the comment), so a changed tag can't
# swap in different code next to the signing key or deploy token.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      # Room regenerates app/schemas/ during the build. If the generated schema differs from
      # the committed one (or is not committed), the database changed without its schema
      # being recorded, so a migration may be missing. Fail instead of letting that merge.
      - name: Check Room schema files are committed and current
        run: |
          changes="$(git status --porcelain --untracked-files=all -- app/schemas)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- app/schemas || true
            # Print new schema files in full so they can be committed from the log.
            git ls-files --others --exclude-standard -- app/schemas | while read -r f; do
              echo "::group::New file $f"; cat "$f"; echo; echo "::endgroup::"
            done
            echo "::error title=Room schema not committed::The build generated app/schemas changes that are not committed. Commit app/schemas/ and add a Migration for any version change."
            exit 1
          fi
          echo "Room schema files are committed and match the build."

      - name: Create temporary PR debug signing key
        if: github.event_name == 'pull_request'
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Aura PR Debug,O=Aura,C=US'

      - name: Restore stable signing key
        if: github.event_name != 'pull_request'
        env:
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$AURA_KEYSTORE_BASE64" || { echo "::error::Missing AURA_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$AURA_KEYSTORE_PASSWORD" || { echo "::error::Missing AURA_KEYSTORE_PASSWORD repository secret"; exit 1; }
          printf '%s' "$AURA_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass "$AURA_KEYSTORE_PASSWORD" -alias androiddebugkey >/dev/null

      - name: Restore Firebase configuration
        if: github.event_name != 'pull_request'
        env:
          AURA_GOOGLE_SERVICES_JSON: ${{ secrets.AURA_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$AURA_GOOGLE_SERVICES_JSON" || { echo "::error::Missing AURA_GOOGLE_SERVICES_JSON repository secret"; exit 1; }
          printf '%s' "$AURA_GOOGLE_SERVICES_JSON" > app/google-services.json
          test -s app/google-services.json
          grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.aistudio.auraai.qvxmk"' app/google-services.json || { echo "::error::Firebase config package name does not match Aura applicationId"; exit 1; }

      - name: Assemble debug APK
        env:
          AURA_KEYSTORE_PASSWORD: ${{ github.event_name == 'pull_request' && 'android' || secrets.AURA_KEYSTORE_PASSWORD }}
          # Claude relay address; empty for PR builds (secrets are not available there).
          AURA_RELAY_URL: ${{ github.event_name != 'pull_request' && secrets.AURA_RELAY_URL || '' }}
        run: gradle --no-daemon :app:assembleDebug

      # Also kept for manual runs, so a branch can be tried on the phone (same signing key) before
      # it is merged. Only main builds are published to the fixed "latest" link below.
      - name: Upload Aura debug APK
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  # Puts the newest main build at one fixed link that installs directly on a phone:
  #   https://github.com/heytylo-png/aura-ai/releases/download/latest-debug/aura-debug.apk
  # Separate job so only this small step gets write access (the build job stays read-only).
  publish-latest-apk:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-latest-apk
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the APK from this run
        run: |
          gh run download "${{ github.run_id }}" --name aura-debug-apk --dir apk
          apk="$(ls apk/*.apk | head -n 1)"
          test -s "$apk"
          mv "$apk" aura-debug.apk

      - name: Update the "latest-debug" release
        run: |
          short="${GITHUB_SHA::7}"
          notes="Newest debug build of Aura from main ($short, $(date -u +'%Y-%m-%d %H:%M UTC')). Install aura-debug.apk directly on the phone."
          if ! gh release view latest-debug >/dev/null 2>&1; then
            gh release create latest-debug --title "Latest debug build" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          else
            gh release edit latest-debug --notes "$notes"
          fi
          gh release upload latest-debug aura-debug.apk --clobber

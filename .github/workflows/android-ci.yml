name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/memory-reliability-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      # Room regenerates app/schemas/ during the build. If the generated schema differs from
      # the committed one (or is not committed), the database changed without its schema
      # being recorded, so a migration may be missing. Fail instead of letting that merge.
      - name: Check Room schema files are committed and current
        run: |
          changes="$(git status --porcelain --untracked-files=all -- app/schemas)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- app/schemas || true
            echo "::error title=Room schema not committed::The build generated app/schemas changes that are not committed. Commit app/schemas/ and add a Migration for any version change."
            exit 1
          fi
          echo "Room schema files are committed and match the build."

      - name: Create temporary debug signing key
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      # Publish the APK as a downloadable GitHub Actions artifact for phone-only users.
      - name: Upload Aura debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

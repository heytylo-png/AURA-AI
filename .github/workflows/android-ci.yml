name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/memory-reliability-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Check Room schema files are committed and current
        run: |
          changes="$(git status --porcelain --untracked-files=all -- app/schemas)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- app/schemas || true
            echo "::error title=Room schema not committed::The build generated app/schemas changes that are not committed. Commit app/schemas/ and add a Migration for any version change."
            exit 1
          fi
          echo "Room schema files are committed and match the build."

      # PR builds use an ephemeral key and never publish an installable APK.
      - name: Create temporary PR debug signing key
        if: github.event_name == 'pull_request'
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Aura PR Debug,O=Aura,C=US'

      # Trusted main/manual builds require the same persistent signing key every time.
      - name: Restore stable signing key
        if: github.event_name != 'pull_request'
        env:
          AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$AURA_KEYSTORE_BASE64" || { echo "::error::Missing AURA_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$AURA_KEYSTORE_PASSWORD" || { echo "::error::Missing AURA_KEYSTORE_PASSWORD repository secret"; exit 1; }
          printf '%s' "$AURA_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass "$AURA_KEYSTORE_PASSWORD" -alias androiddebugkey >/dev/null

      # Firebase config is required for trusted installable builds. It is supplied as a
      # repository secret, never committed to the public repository.
      - name: Restore Firebase configuration
        if: github.event_name != 'pull_request'
        env:
          AURA_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.AURA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$AURA_GOOGLE_SERVICES_JSON_BASE64" || { echo "::error::Missing AURA_GOOGLE_SERVICES_JSON_BASE64 repository secret"; exit 1; }
          printf '%s' "$AURA_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json
          grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.aistudio.auraai.qvxmk"' app/google-services.json || { echo "::error::Firebase config package name does not match Aura applicationId"; exit 1; }

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Aura debug APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

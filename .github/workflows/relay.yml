name: Claude relay

on:
  pull_request:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run relay tests
        working-directory: relay
        run: node --test

      # Deploys only from main (push or manual run). PRs are test-only and never see secrets.
      - name: Check deployment secrets
        id: secrets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AURA_GOOGLE_SERVICES_JSON: ${{ secrets.AURA_GOOGLE_SERVICES_JSON }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY AURA_GOOGLE_SERVICES_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Relay not deployed::Missing repository secrets:$missing. Tests passed; add the secrets and re-run this workflow to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          project_id="$(printf '%s' "$AURA_GOOGLE_SERVICES_JSON" | jq -r '.project_info.project_id // empty')"
          if [ -z "$project_id" ]; then
            echo "::error title=Firebase project ID missing::AURA_GOOGLE_SERVICES_JSON has no project_info.project_id."
            exit 1
          fi
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy relay to Cloudflare
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Until you add your access ID, a placeholder keeps the allowlist effectively empty.
          ALLOWED_UIDS: ${{ secrets.AURA_ALLOWED_UIDS || 'none-yet' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: '4.20.0'
          secrets: |
            ANTHROPIC_API_KEY
            ALLOWED_UIDS
          command: deploy --var FIREBASE_PROJECT_ID:${{ steps.secrets.outputs.project_id }}

name: Claude relay

on:
  pull_request:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

# Actions are pinned to exact commits (the tag is in the comment), so a changed tag can't
# swap in different code next to the signing key or deploy token.
permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Run relay tests
        working-directory: relay
        run: node --test

      # Deploys only from main (push or manual run). PRs are test-only and never see secrets.
      - name: Check deployment secrets
        id: secrets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AURA_GOOGLE_SERVICES_JSON: ${{ secrets.AURA_GOOGLE_SERVICES_JSON }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY AURA_GOOGLE_SERVICES_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Relay not deployed::Missing repository secrets:$missing. Tests passed; add the secrets and re-run this workflow to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          project_id="$(printf '%s' "$AURA_GOOGLE_SERVICES_JSON" | jq -r '.project_info.project_id // empty')"
          if [ -z "$project_id" ]; then
            echo "::error title=Firebase project ID missing::AURA_GOOGLE_SERVICES_JSON has no project_info.project_id."
            exit 1
          fi
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Optional daily caps: attach the key-value store that holds the counts, if one was set up.
      - name: Attach the usage store for daily limits
        if: steps.secrets.outputs.ready == 'true'
        env:
          AURA_USAGE_KV_ID: ${{ secrets.AURA_USAGE_KV_ID }}
        run: |
          if [ -z "$AURA_USAGE_KV_ID" ]; then
            echo "::notice title=Daily limits off::AURA_USAGE_KV_ID is not set, so only the per-minute limits apply."
            exit 0
          fi
          if ! printf '%s' "$AURA_USAGE_KV_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error title=Bad AURA_USAGE_KV_ID::It must be the 32-character ID of a Cloudflare KV namespace."
            exit 1
          fi
          printf '\n[[kv_namespaces]]\nbinding = "USAGE"\nid = "%s"\n' "$AURA_USAGE_KV_ID" >> relay/wrangler.toml

      - name: Deploy relay to Cloudflare
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Until you add your access ID, a placeholder keeps the allowlist effectively empty.
          ALLOWED_UIDS: ${{ secrets.AURA_ALLOWED_UIDS || 'none-yet' }}
          # Optional: read-aloud with ElevenLabs. Without the secret, /v1/speak reports "not configured".
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || 'not-set' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: '4.20.0'
          secrets: |
            ANTHROPIC_API_KEY
            ALLOWED_UIDS
            ELEVENLABS_API_KEY
          command: deploy --var FIREBASE_PROJECT_ID:${{ steps.secrets.outputs.project_id }}
